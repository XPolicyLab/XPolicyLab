# @package _global_

defaults:
  - train
  - override /task: libero_unified_flex_2cam224_32d_rotvec_1e-4
  - _self_

ckpt: null
gpu_id: 0

# Which cfg the eval builds model/data from.
# auto (the run's saved config.yaml if present, else current) | saved |
# saved_with_overrides | current
eval_config_source: "auto"

model:
  load_text_encoder: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

EVALUATION:
  task_suite_name: libero_spatial
  task_id: 0
  num_trials: 50
  output_dir: ./evaluate_results/libero/${hydra:runtime.choices.task}/${now:%Y%m%d_%H%M%S}

  env_num: 1
  num_steps_wait: 30
  replan_steps: 10
  binarize_gripper: true
  use_action_ensembler: false
  visualize_future_video: false

  # Action inference
  action_horizon: null
  num_inference_steps: ${eval_num_inference_steps}
  sigma_shift: null
  text_cfg_scale: 1.0
  negative_prompt: ""
  rand_device: cpu
  tiled: false

  # Inference optimization
  torch_compile: false
  torch_compile_mode: "reduce-overhead"  # default, reduce-overhead, max-autotune
  quantization: null  # null or "int8"

  dynamic_step_skip: false
  step_skip_thresholds: [[0.95, 4], [0.93, 2]]
  step_skip_sim_sources: null
  step_skip_sim_aggregation: "mean"

  tshape_eval_resize: "stretch"

  # Optional external inputs
  dataset_stats_path: null
  device: cuda

MULTIRUN:
  create_only: false
  task_file: null
  task_suite_names:
    - libero_10
    - libero_goal
    - libero_spatial
    - libero_object
  num_gpus: 8
  max_tasks_per_gpu: 2

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
