# @package _global_

defaults:
  - train
  - override /task: robotwin_unified_flex_3cam_384_1e-4
  - _self_

ckpt: null
gpu_id: 0

model:
  load_text_encoder: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

EVALUATION:
  robotwin_root: third_party/RoboTwin
  policy_name: flexpi_policy
  task_name: null
  task_config: demo_randomized
  instruction_type: unseen
  eval_num_episodes: 100
  output_dir: ./evaluate_results/robotwin/${hydra:runtime.choices.task}/${now:%Y%m%d_%H%M%S}

  # Action inference
  action_horizon: null
  replan_steps: 32
  num_inference_steps: ${eval_num_inference_steps}
  sigma_shift: null
  text_cfg_scale: 1.0
  negative_prompt: ""
  rand_device: cpu
  tiled: false
  offload_text_encoder: false  # move T5 to CPU between calls to save ~10GB VRAM
  timing_enabled: false
  skip_get_obs_within_replan: true

  # Inference optimization
  torch_compile: false
  torch_compile_mode: "reduce-overhead"  # default, reduce-overhead, max-autotune
  torch_compile_scope: "step"  # step (per-denoise-step graphs) | loop (whole loop = one CUDA graph)
  quantization: null  # null, "int8" (weight-only) or "fp8" (dynamic act+weight, SM89+)
  attn_backend: "sdpa"  # sdpa (dense-mask) | flex (BlockMask FlexAttention, joint paths only) | auto (fastest SDPA kernel per site, same math)
  compile_encoders: false  # also torch.compile the observation encoders (VAE/DINO/pointmap; ~20ms/call)
  torch_compile_backend: "inductor"  # inductor | tensorrt (torch-tensorrt dynamo; bf16, quantization must be null)

  dynamic_step_skip: false
  step_skip_thresholds: [[0.95, 4], [0.93, 2]]
  step_skip_sim_sources: null
  step_skip_sim_aggregation: "mean"

  # Runtime inputs
  dataset_stats_path: null
  device: cuda

MULTIRUN:
  enabled: false
  num_gpus: 8
  max_tasks_per_gpu: 2
  phases: [clean, random]   # subset of {clean, random}; order = launch order per task
  tasks: null               # null = all tasks from _eval_step_limit.yml; or explicit list e.g. [adjust_bottle, beat_block_hammer]
  shard: null               # null = no sharding; "N/K" = block shard (this-machine N of K, 0-indexed): tasks[N*chunk:(N+1)*chunk], chunk=ceil(total/K)

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
