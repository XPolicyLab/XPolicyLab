# @package _global_
#
# FlexPi (flex_joint) — YAM real-world bimanual. 32D EEF/grip/joint-grouped
# layout in yam_openpi's `action_rep="rel"` regime (EEF SE(3) body-frame
# relative + joint scalar delta + gripper absolute). One checkpoint serves all
# 8 inference regimes via per-call joint_* on infer_action. See docs/YAM.md.

defaults:
  - override /data: yam
  - override /model: flexpi
  - _self_

batch_size: 9
num_workers: 8

model:
  mot_checkpoint_mixed_attn: false

data:
  train:
    concat_multi_camera: ${model.composite_layout}

learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 2
save_every: 200
eval_every: 500

gradient_accumulation_steps: 8
weight_decay: 1e-2
resume: null
