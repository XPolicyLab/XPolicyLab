# @package _global_
#
# FlexPi (flex_joint) — LIBERO 4-suite preset, 32D rotvec arm-grouped actions.
# One checkpoint serves all 8 inference regimes via per-call joint_video /
# joint_dino / joint_pointmap on infer_action. See docs/LIBERO.md.

defaults:
  - override /data: libero
  - override /model: flexpi
  - _self_

batch_size: 6
num_workers: 8

model:
  mot_checkpoint_mixed_attn: false
  composite_layout: "tshape_libero_2cam_448x512"
  composite_layout_slot_key_map: ${data.train.composite_layout_slot_key_map}
  dino_temporal_stride: 2

learning_rate: 1e-4
num_epochs: 20
max_steps: null
log_every: 2
save_every: 200
eval_every: 500

gradient_accumulation_steps: 8
weight_decay: 1e-2
resume: null
