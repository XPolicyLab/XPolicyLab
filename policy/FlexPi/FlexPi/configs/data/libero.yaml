train:
  # LIBERO 4-suite, 2 real cameras + depth, 32D-rotvec actions.
  _target_: flexpi.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  depth_codec: ffv1
  synthetic_zero_cams:
    - cam_right_wrist
  dataset_dirs:
    - ./data/libero_mujoco3.3.2_depth/libero_spatial_no_noops_lerobot
    - ./data/libero_mujoco3.3.2_depth/libero_object_no_noops_lerobot
    - ./data/libero_mujoco3.3.2_depth/libero_goal_no_noops_lerobot
    - ./data/libero_mujoco3.3.2_depth/libero_10_no_noops_lerobot
  shape_meta:
    images:
      - key: cam_high
        raw_shape: [3, 512, 512]
        shape: [3, 256, 320]
      - key: cam_left_wrist
        raw_shape: [3, 512, 512]
        shape: [3, 256, 320]
    depth:
      - key: cam_high
        raw_shape: [1, 512, 512]
        shape: [1, 256, 320]
      - key: cam_left_wrist
        raw_shape: [1, 512, 512]
        shape: [1, 224, 224]
    action:
      # 7D rotvec [Δpos, Δrotvec, gripper].
      - key: default
        raw_shape: 7
        shape: 7
    state:
      # 8D rotvec [pos, rotvec, finger_L_qpos, finger_R_qpos].
      - key: default
        raw_shape: 8
        shape: 8
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4                 # 32 action, 9 video frames
  video_size: [448, 512]                     # == the composite HW of the layout below
  camera_key: null
  val_set_proportion: 0.0
  is_training_set: true
  pretrained_norm_stats: null
  skip_padding_as_possible: false
  # Single source of truth: the model owns the geometry, the dataset follows.
  concat_multi_camera: ${model.composite_layout}
  # Wrist 16:9 on top, exterior bottom-left, synthetic bottom-right. Required by
  # tshape_libero_2cam_448x512, which declares no default slot map. null falls
  # back to the layout's own map (the 384×320 T puts the exterior on top).
  composite_layout_slot_key_map:
    slot_top: cam_left_wrist
    slot_bl:  cam_high
    slot_br:  cam_right_wrist
  processor:
    _target_: flexpi.datasets.lerobot.processors.flexpi_processor.FlexPiProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 2                    # 2 disk cams; zero cam added later by dataset
    action_output_dim: 32                    # 32D arm-grouped layout
    proprio_output_dim: 32
    delta_action_dim_mask:
      default: [true, true, true, true, true, true, false]   # 7 entries on raw 7D — same as 34D

    action_state_transforms: null            # NO rotation transform — rotvec passes through

    use_stepwise_action_norm: False
    norm_default_mode: z-score
    norm_exception_mode: null

    # 32D arm-grouped layout (see top-of-file comment for full slot map).
    action_state_merger:
      _target_: flexpi.datasets.lerobot.transforms.action_state_merger.ScatterToChannels
      total_dim: 32
      used_action_channel_ids: [0, 1, 2, 3, 4, 5, 18]
      used_state_channel_ids:  [0, 1, 2, 3, 4, 5, 18, 19]

    train_transforms:
      - _target_: flexpi.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [256, 320]
    val_transforms:
      - _target_: flexpi.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [256, 320]
  text_embedding_cache_dir: ./data/text_embeds_cache/libero
  context_len: 128
