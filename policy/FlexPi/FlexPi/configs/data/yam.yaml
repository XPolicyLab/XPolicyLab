train:
  # YAM real-world bimanual, 32D eef32 layout. Actions are supervised relative
  # to the first obs (EEF SE(3) body-frame, joint scalar delta, gripper
  # absolute) by Yam32DRelativeAction; state stays absolute. See docs/YAM.md.
  _target_: flexpi.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  depth_codec: ffv1
  dataset_dirs:
    - ./data/yam/my_task
  dataset_weights: null
  samples_per_epoch: null
  shape_meta:
    images:
      - key: cam_high
        raw_shape: [3, 360, 640]
        shape: [3, 256, 320]
      - key: cam_left_wrist
        raw_shape: [3, 360, 640]
        shape: [3, 224, 224]
      - key: cam_right_wrist
        raw_shape: [3, 360, 640]
        shape: [3, 224, 224]
    depth:
      - key: cam_high
        raw_shape: [1, 360, 640]
        shape: [1, 256, 320]
      - key: cam_left_wrist
        raw_shape: [1, 360, 640]
        shape: [1, 224, 224]
      - key: cam_right_wrist
        raw_shape: [1, 360, 640]
        shape: [1, 224, 224]
    action:
      - key: default
        raw_shape: 32
        shape: 32
    state:
      - key: default
        raw_shape: 32
        shape: 32
  num_frames: 33                            # 1 + 4k (matches LIBERO/AgiBot/RoboTwin)
  global_sample_stride: 1
  action_video_freq_ratio: 4                # 32 actions, 9 video frames
  video_size: [384, 320]                    # head 256×320 + wrists 128×160 composite
  camera_key: null
  val_set_proportion: 0.0
  is_training_set: true
  pretrained_norm_stats: null               # null = compute on first run
  skip_padding_as_possible: false
  concat_multi_camera: "tshape_384x320"           # canonical-name remap + composite slot layout
  processor:
    _target_: flexpi.datasets.lerobot.processors.flexpi_processor.FlexPiProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 3
    action_output_dim: 32
    proprio_output_dim: 32

    action_state_transforms:
      - _target_: flexpi.datasets.lerobot.transforms.yam_relative_action.Yam32DRelativeAction
        anchor: "first"

    use_stepwise_action_norm: False
    norm_default_mode: q01/q99
    norm_exception_mode: null

    # Identity scatter: all 32 slots used (YAM dual-arm fills everything).
    action_state_merger:
      _target_: flexpi.datasets.lerobot.transforms.action_state_merger.ScatterToChannels
      total_dim: 32

    # rot6d slots pass through unnormalized — SO(3) is restored by Gram-Schmidt
    # at decode time, not by bounds.
    norm_skip_dims_mask:
      action:
        default:
          [false, false, false,                                  # 0-2   L_pos     (rel)
           true,  true,  true,  true,  true,  true,              # 3-8   L_rot6d   (identity)
           false, false, false,                                  # 9-11  R_pos     (rel)
           true,  true,  true,  true,  true,  true,              # 12-17 R_rot6d   (identity)
           false,                                                # 18    L_grip    (absolute)
           false,                                                # 19    R_grip    (absolute)
           false, false, false, false, false, false,             # 20-25 L_joint   (delta)
           false, false, false, false, false, false]             # 26-31 R_joint   (delta)
      state:
        default:
          [false, false, false,
           true,  true,  true,  true,  true,  true,
           false, false, false,
           true,  true,  true,  true,  true,  true,
           false,
           false,
           false, false, false, false, false, false,
           false, false, false, false, false, false]

    # Yam32DRelativeAction handles chunk boundaries itself, so the
    # rotvec/delta-path pad-zeroing is off.
    delta_action_dim_mask: null

    train_transforms:
      cam_high:
        - _target_: flexpi.datasets.lerobot.transforms.image.ToTensor
        - _target_: torchvision.transforms.Resize
          size: [256, 320]
      cam_left_wrist:
        - _target_: flexpi.datasets.lerobot.transforms.image.ToTensor
        - _target_: torchvision.transforms.Resize
          size: [224, 224]
      cam_right_wrist:
        - _target_: flexpi.datasets.lerobot.transforms.image.ToTensor
        - _target_: torchvision.transforms.Resize
          size: [224, 224]
    val_transforms:
      cam_high:
        - _target_: flexpi.datasets.lerobot.transforms.image.ToTensor
        - _target_: torchvision.transforms.Resize
          size: [256, 320]
      cam_left_wrist:
        - _target_: flexpi.datasets.lerobot.transforms.image.ToTensor
        - _target_: torchvision.transforms.Resize
          size: [224, 224]
      cam_right_wrist:
        - _target_: flexpi.datasets.lerobot.transforms.image.ToTensor
        - _target_: torchvision.transforms.Resize
          size: [224, 224]
  text_embedding_cache_dir: ./data/text_embeds_cache/yam
  context_len: 128

val:
  _target_: ${data.train._target_}
  depth_codec: ${data.train.depth_codec}
  dataset_dirs: ${data.train.dataset_dirs}
  shape_meta: ${data.train.shape_meta}
  num_frames: ${data.train.num_frames}
  global_sample_stride: ${data.train.global_sample_stride}
  action_video_freq_ratio: ${data.train.action_video_freq_ratio}
  video_size: ${data.train.video_size}
  camera_key: ${data.train.camera_key}
  val_set_proportion: ${data.train.val_set_proportion}
  is_training_set: false
  pretrained_norm_stats: null               # runtime fills from work_dir/dataset_stats.json
  skip_padding_as_possible: ${data.train.skip_padding_as_possible}
  concat_multi_camera: ${data.train.concat_multi_camera}
  processor: ${data.train.processor}        # Hydra instantiates a fresh processor; .eval() set by trainer
  text_embedding_cache_dir: ${data.train.text_embedding_cache_dir}
  context_len: ${data.train.context_len}
