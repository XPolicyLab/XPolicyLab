# Copy this file to paths_config.yml and replace all required paths.
robotwin_root: "/path/to/RoboTwin"
conda_env: "/path/to/conda/envs/RoboTwin"
# ModelScope example: Kosmos524/ola_sem
checkpoint_path: "/path/to/checkpoints/ola_sem/pytorch_model"
wan_path: "/path/to/Wan2.2-TI2V-5B"
vlm_path: "/path/to/Qwen3-VL-2B-Instruct"

# Empty means auto-detect with nvidia-smi.
gpu_ids: []

# Use demo_clean for Clean2Clean or demo_randomized for Clean2Rand.
task_config: "demo_clean"
seed: 42
tasks_file: "tasks_all.txt"
instruction_type: "unseen"
test_num: 100

# Kosmos524/ola_sem is a history-flow checkpoint. Keep config.json beside the
# downloaded pytorch_model directory so the policy can validate its metadata.
inference_mode: "history_flow"
num_inference_timesteps: 4
history_action_noise_std: 0.02
future_video_denoise_fraction: 1.0
