[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pica-wam-internw0-delta"
version = "0.1.0"
description = "InternW0-Delta with PICA-WAM cross-appearance self-alignment (vendored for XPolicyLab)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.14"
dependencies = [
  "accelerate==1.14.0",
  "av==16.0.1",
  "datasets==3.6.0",
  "einops==0.8.1",
  "gitpython==3.1.45",
  "huggingface-hub==1.21.0",
  "hydra-core==1.3.2",
  "imageio==2.37.0",
  "imageio-ffmpeg==0.6.0",
  "jsonlines==4.0.0",
  "numpy==1.26.4",
  "omegaconf==2.3.0",
  "packaging==25.0",
  "pandas==2.2.3",
  "pillow==12.0.0",
  "pyarrow==24.0.0",
  "PyYAML==6.0.3",
  "scipy==1.15.3",
  "regex==2025.11.3",
  "rich==14.2.0",
  "safetensors==0.8.0",
  "termcolor==2.5.0",
  "torch==2.10.0",
  "torchcodec==0.10",
  "torchvision==0.25.0",
  "tqdm==4.66.5",
  "transformers==5.13.0",
  "typing-extensions==4.15.0",
]

[project.optional-dependencies]
distillation = ["addict==2.4.0", "evo==1.34.1", "opencv-python-headless==4.10.0.84"]
train = ["deepspeed==0.19.2"]
logging = ["wandb==0.23.1"]
modelscope = ["modelscope==1.34.0"]
visualize = ["pybullet==3.2.7", "trimesh==4.4.3", "pycollada==0.9.2"]
eval = [
  "mujoco==3.3.2", "robosuite==1.4.0", "robomimic==0.2.0",
  "bddl==1.0.1", "gym==0.25.2", "easydict==1.9",
  "opencv-python==4.6.0.66", "Wand==0.7.2", "scikit-image==0.26.0",
  "h5py==3.16.0", "cloudpickle==2.1.0", "PyOpenGL==3.1.10",
  "glfw==2.10.0", "matplotlib==3.10.9", "numba==0.65.1",
]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wam*"]
