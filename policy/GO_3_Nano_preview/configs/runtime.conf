# GO-3 Nano Preview runtime configuration (Bash syntax).
# Every shell entry point loads this file automatically. No manual source/export
# step is needed. Fill in the paths after ':-', for example:
# POLICY_ENV="${POLICY_ENV:-/opt/venvs/go3}"
# An environment variable supplied for a particular run overrides its default here.
# Use absolute paths; POLICY_ENV/EVAL_ENV name directories, not Python executables.

# --- Inference assets: required when evaluating an existing checkpoint ---
# Python environment containing the policy inference/training dependencies.
export POLICY_ENV="${POLICY_ENV:-}"
# Checkpoint directory containing config.json, video weights, and action_model/.
export CKPT_PATH="${CKPT_PATH:-}"
# Model initialization files; blank defaults use matching files in the finally resolved checkpoint.
export VIDEO_PRETRAIN_PATH="${VIDEO_PRETRAIN_PATH:-}"
export ACTION_PRETRAIN_PATH="${ACTION_PRETRAIN_PATH:-}"
# Complete Qwen 3.5 2B model and tokenizer/processor directory.
export VLM_MODEL_PATH="${VLM_MODEL_PATH:-}"
# VAE directory containing its configuration and weights.
export VAE_PATH="${VAE_PATH:-}"
# VAE latent statistics file; distinct from bundled state/action statistics.
export STATS_TRACKER_PATH="${STATS_TRACKER_PATH:-${VAE_PATH:+$VAE_PATH/latent_stats.pth}}"
export ROBOT_NAME="${ROBOT_NAME:-robotwin}"

# --- Official evaluation: defaults used by `bash eval.sh` with no arguments ---
# XPolicyLab checkout; normally inferred from this policy directory.
export XPL_ROOT="${XPL_ROOT:-$(cd "$POLICY_DIR/../.." && pwd)}"
# Python environment containing RoboTwin (or the Debug client dependencies).
export EVAL_ENV="${EVAL_ENV:-}"
# Optional shell script required to activate your simulator's runtime libraries.
export ROBOTWIN_ACTIVATE_SCRIPT="${ROBOTWIN_ACTIVATE_SCRIPT:-}"
# Profile filename stem supplied by the external simulator, e.g. arx_x5.
export EVAL_ENV_CFG_TYPE="${EVAL_ENV_CFG_TYPE:-}"
export EVAL_ENV_TYPE="${EVAL_ENV_TYPE:-sim}"  # sim or debug
export EVAL_BENCH="${EVAL_BENCH:-RoboTwin}"
export EVAL_TASK="${EVAL_TASK:-adjust_bottle}"
export EVAL_ACTION_TYPE="${EVAL_ACTION_TYPE:-joint}"
export EVAL_SEED="${EVAL_SEED:-42}"
export POLICY_GPU_ID="${POLICY_GPU_ID:-0}"
export EVAL_GPU_ID="${EVAL_GPU_ID:-0}"
export DEBUG_EPISODES="${DEBUG_EPISODES:-2}"

# --- Training/data paths: not required for checkpoint evaluation ---
# Initial video/action weights for SFT; separate from the evaluation checkpoint.
export SFT_VIDEO_PRETRAIN_PATH="${SFT_VIDEO_PRETRAIN_PATH:-}"
export SFT_ACTION_PRETRAIN_PATH="${SFT_ACTION_PRETRAIN_PATH:-}"
# Training JSONL metadata and root directory containing episode videos/actions.
export SFT_JSONL_PATH="${SFT_JSONL_PATH:-}"
export SFT_DATA_ROOT="${SFT_DATA_ROOT:-}"
# Validation metadata/data root; configuration imports require both, even when
# --skip-validation is used in a short training test.
export SFT_VAL_JSONL_PATH="${SFT_VAL_JSONL_PATH:-}"
export SFT_VAL_DATA_ROOT="${SFT_VAL_DATA_ROOT:-}"
# Task/step text rewrite mapping JSON files.
export TASK_RECAP_PATH="${TASK_RECAP_PATH:-}"
export STEP_RECAP_PATH="${STEP_RECAP_PATH:-}"
# New output directory for process_data.sh, outside this policy directory.
# Standard arguments default to RUN_ROOT/data/<bench>-<ckpt>-<profile>-<action>.
export SFT_PREPARED_DIR="${SFT_PREPARED_DIR:-}"
# Root for training checkpoints and evaluation outputs, outside the checkout.
export RUN_ROOT="${RUN_ROOT:-$HOME/robotwin-runs}"
# Optional exact training output directory; otherwise RUN_ROOT/checkpoints/run_name.
export SFT_OUTPUT_DIR="${SFT_OUTPUT_DIR:-}"
# Optional training recipe override; all train.sh forms default to robotwin_sft_ka_step.py.
export SFT_CONFIG="${SFT_CONFIG:-}"
export SFT_RUN_NAME="${SFT_RUN_NAME:-cotrain_robotwin_sft_ka_robotype}"
export SFT_SEED="${SFT_SEED:-1016}"
# Optional total steps and processes per node. Blank process count detects GPUs.
export SFT_STEPS="${SFT_STEPS:-}"
export SFT_NPROC="${SFT_NPROC:-}"

# --- Optional inference metadata ---
# Optional metadata used by the inference configuration; JSON arrays of paths.
export TRAIN_JSONL_PATHS="${TRAIN_JSONL_PATHS:-[]}"
export DATA_VIDEO_ROOTS="${DATA_VIDEO_ROOTS:-[]}"

# Interpreter selection only; role-specific environment changes live in tools/policy_env.sh.
export POLICY_DIR
export POLICY_PYTHON="${POLICY_ENV:+$POLICY_ENV/bin/python}"
