# RoboTwin 2 post-training overlay for supported LeRobot prompt datasets.
includes:
  - common_wan22.yaml

selectors:
  task: ${oc.env:WSP_TASK,robotwin2}
  run_name: ${oc.env:RUN_NAME,baseline}
  mode: ${oc.env:WSP_MODE,interactive}
  visual_prompt: ${oc.env:VISUAL_PROMPT,demo}
  dataset_name: ${oc.env:NATIVE_DATASET_NAME,worldscape_lerobot_demo}

profiles:
  dataset_name:
    worldscape_lerobot_demo:
      _requires_:
        mode: [interactive, auto]
        visual_prompt: demo
    worldscape_lerobot_goal:
      _requires_:
        mode: [interactive, auto]
        visual_prompt: goal
    worldscape_lerobot_text:
      _requires_:
        mode: [interactive, auto]
        visual_prompt: none

batch_adapter:
  embodiment_ids:
    robotwin2: 0

native_export:
  enabled: true
  every_checkpoint: true
  model_variant: wsp2-wan22-5b
  tokenizer_source: ${model.tokenizer_path}
  normalization:
    schema_version: "1"
    visual:
      input_range: zero_one
      model_range: minus_one_one
    state: {kind: bundled, reference: transform_bundle.json}
    action: {kind: bundled, reference: transform_bundle.json}
  provenance:
    exporter: worldscape-policy-native-training
    task: ${selectors.task}
  transform_bundle:
    _target_: worldscape_policy.training.native_export.build_zscore_transform_bundle
    image_input_range: zero_one
    statistics_path: ${oc.env:ZSCORE_STATS_PATH}
    clip_range: [-5.0, 5.0]
    action_mode: ${data_loader.action_mode}
    relative_action: ${data_loader.relative_action}
    provenance:
      source: native-posttraining
      normalization: global_zscore
    embodiments:
      robotwin2:
        embodiment_id: 0
        max_state_dim: 64
        max_action_dim: 32
        state_fields: [[state.vector, 14]]
        action_fields: [[action.vector, 14]]

model:
  pretrained_action_adapter_index: ${pretrained_adapter_source_rows.robotwin2}
  model_config:
    model:
      shape:
        # Temporal packing emits 8 video frames per chunk plus one endpoint.
        num_frames: ${oc.decode:${oc.env:WAM_NUM_FRAMES,33}}
      wam:
        core:
          parameters:
            # Must match temporal packing in the dataset below.
            max_chunk_size: ${oc.decode:${oc.env:WAM_MAX_CHUNK_SIZE,4}}

data_loader:
  _target_: worldscape_policy.training.data.build_registered_loader
  dataset_name: ${selectors.dataset_name}
  batch_size: ${oc.decode:${oc.env:PER_DEVICE_TRAIN_BATCH_SIZE,8}}
  shuffle: true
  bucket_by_length: true
  num_workers: ${oc.decode:${oc.env:DATALOADER_NUM_WORKERS,2}}
  prefetch_factor: 2
  persistent_workers: true
  seed: ${oc.decode:${oc.env:SEED,62}}
  augment_video: ${oc.decode:${oc.env:AUGMENT_VIDEO,true}}
  raw_video_observation_key: ${oc.decode:${oc.env:RAW_VIDEO_OBSERVATION_KEY,null}}
  training: true
  action_mode: joint
  relative_action: false
  wo_norm: false
  normalization_statistics_path: ${oc.env:ZSCORE_STATS_PATH}
  normalization_clip_range: [-5.0, 5.0]
  dataset_kwargs:
    data_root: ${oc.env:DATA_ROOT}
    embodiment: robotwin2
    action_horizon: ${oc.decode:${oc.env:ACTION_HORIZON,24}}
    temporal_packing: true
    max_chunk_size: ${oc.decode:${oc.env:WAM_MAX_CHUNK_SIZE,4}}
    max_event_chunks: ${oc.decode:${oc.env:MAX_EVENT_CHUNKS,1}}
    history_num_frames: ${oc.decode:${oc.env:VLM_HISTORY_NUM_FRAMES,8}}
    history_stride: ${oc.decode:${oc.env:VLM_HISTORY_STRIDE,24}}
    history_window: ${oc.decode:${oc.env:VLM_HISTORY_WINDOW,192}}
    single_high_level_instruction_per_episode: ${oc.decode:${oc.env:SINGLE_HIGH_LEVEL_INSTRUCTION_PER_EPISODE,false}}
    episode_cache_size: ${oc.decode:${oc.env:LEROBOT_EPISODE_CACHE_SIZE,2}}
    cache_video_resize_width: ${oc.decode:${oc.env:CACHE_VIDEO_RESIZE_WIDTH,320}}
    cache_video_resize_height: ${oc.decode:${oc.env:CACHE_VIDEO_RESIZE_HEIGHT,160}}
    wo_norm: false
    seed: ${oc.decode:${oc.env:SEED,62}}

freeze:
  config:
    vlm: ${oc.decode:${oc.env:FREEZE_VLM,true}}

trainer:
  t5_prompt_template: >-
    A video shows that a robot {instruction} The robot {instruction}
