policy_name: WorldScape_Policy_2
protocol: ws
host: localhost
port: null

bench_name: null
task_name: null
ckpt_name: null
env_cfg_type: null
action_type: joint
seed: 0
eval_batch: false

# Null paths select bundled source and shared XPolicyLab checkpoint resolution.
worldscape_root: null
checkpoint_path: null
device: cuda
mode: auto

action_horizon: 24
replan_steps: null
observation_interval: null
memory_reset_chunks: 0
vlm_history_num_frames: 4
diffusion_view_layout: null

vlm_cot_prompt: "You are a robot planner. Instructions: {task}. Given the current high-level task instruction and current head-view observation, predict the next atomic action subtask for the next second."
t5_prompt_template: "A video shows that a robot {instruction} The robot {instruction}"
default_instruction: "follow the instruction"
validate_checkpoint_artifacts: false
log_inference: true
allow_dummy_policy: false

request_timeout_s: 600
max_connect_attempts: 240
connect_retry_delay_s: 5
max_connect_seconds: 1200
ws_ping_interval_s: 20
ws_ping_timeout_s: 20

# Native defaults; select deploy_robodojo.yml for RoboDojo checkpoints.
runtime_profile: robotwin2
input_color_order: rgb
# Indices into adapter views, placed as top / bottom-left / bottom-right.
diffusion_concat_view_order: [0, 1, 2]
single_window_reference: latest
# Output canvas in pixels; applies only to robotwin_concat. Match the checkpoint.
diffusion_concat_height: 384
diffusion_concat_width: 320
wam_history_mode: periodic
short_window_for_non_memory_tasks: false
memory_window_chunks: null
ordinary_window_chunks: null
constrain_action_padding: false
interactive_qwen:
  enabled: false
press_by_number_prompt:
  enabled: false
