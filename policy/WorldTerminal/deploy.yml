# Seconds one forwarded request may take.  The hosted server answers get_action within its
# own poll window (20 s) whether or not the program has stepped; this stays far above it.
api_request_timeout_s: 120.0
# Connection/handshake timeout. Failed action requests are not automatically replayed.
api_connect_seconds: 120.0

