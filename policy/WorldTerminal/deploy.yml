# Where the hosted policy server is.  Not a secret and not stored here: the submitting team
# gives the evaluator `WORLDTERMINAL_API_URL` (ws:// or wss://host:port) and, if the server asks for
# one, `WORLDTERMINAL_API_TOKEN`.  The URL may also be configured below; keep the token in the environment.
