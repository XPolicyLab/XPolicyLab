# Basic experiment configuration
policy_name: Xiaomi_Robotics_1
protocol: ws
host: localhost
bench_name: null
task_name: null
ckpt_name: null
env_cfg_type: null
seed: null
expert_data_num: null
eval_batch: true
eval_env: debug

# Model configuration
# Only "ee" is supported: the packed 60-dim action carries end-effector slots
# only (ACTION_PARTS in mibot/utils/io.py), so joint targets cannot be recovered.
action_type: ee
model_dir: null

# WUJI 58-D hybrid (env_cfg_type: tianji_wuji, two 20-DOF Wuji hands): frame
# the wrist poses are expressed in, te2 (WUJI SimBench head camera) or world.
# Must match the WRIST_FRAME the dataset was converted with. Ignored for arx_x5.
wrist_frame: te2

# Number of leading steps of each predicted chunk to execute.
# 0 (or null) executes the whole chunk, whose length comes from the checkpoint.
action_length: 30

# Image preprocessing, matching mibot.utils.io.resize_image used by the
# official client and by JsonDataset at training time.
image_factor: 32
image_max_pixels: 160000

# VLM processor (HuggingFace repo id or local path)
vlm_processor_path: Qwen/Qwen3-VL-4B-Instruct

# Default instruction when obs does not carry one
default_prompt: Perform the instructed bimanual manipulation task.

port: 6000
