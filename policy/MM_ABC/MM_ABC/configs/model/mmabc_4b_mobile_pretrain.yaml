# MM-ABC / Qwen3-VL-4B on Mobile, finetuned from the MM-ABC pretrain (80-d canonical layout).
defaults: configs/model/mmabc_4b.yaml

canonical: configs/canonical/canonical_80_mobile.yaml

backbone:
  gradient_checkpointing: false

flow:
  chunk_size: 32
  near_steps: 32
  execute_steps: 16
  pred_type: x
  loss_type: v
  normalize_weight: true

future:
  enabled: true
  offsets: [32, 32]

prompt:
  header: true
