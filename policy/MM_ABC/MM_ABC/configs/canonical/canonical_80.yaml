# Shared 80-d state/action layout: left arm [0,29), right arm [29,58), body [58,80).

total_dim: 80

# `kind` drives the delta rule and the mask rule in transforms.py.
#   joint      -> target = a[t+k] - s[t], one target dim per storage dim
#   eef_pos    -> target = p[t+k] - p[t] in the reference frame, 3 dims
#   eef_rot    -> target = axis-angle(inv(R[t]) @ R[t+k]), 3 target dims out of 6
#   gripper    -> absolute, no delta
#   base_twist -> absolute (already a velocity), no delta
#   base_pose  -> target = planar delta (dx, dy, dyaw)
#   discrete   -> absolute, no normalisation
#   hand       -> joint-like, currently unused by the corpus
#   reserved   -> never carries a label
segments:
  # ---- left arm block [0, 29) ----
  - {name: left_arm_joints,   range: [0, 7],   kind: joint,      group: arm,  norm: meanstd}
  - {name: left_eef_position, range: [7, 10],  kind: eef_pos,    group: eef,  norm: meanstd}
  - {name: left_eef_rotation, range: [10, 16], kind: eef_rot,    group: eef,  norm: meanstd, target_dim: 3}
  - {name: left_gripper,      range: [16, 17], kind: gripper,    group: hand, norm: minmax}
  - {name: left_hand_joints,  range: [17, 29], kind: hand,       group: hand, norm: meanstd}
  # ---- right arm block [29, 58) ----
  - {name: right_arm_joints,   range: [29, 36], kind: joint,     group: arm,  norm: meanstd}
  - {name: right_eef_position, range: [36, 39], kind: eef_pos,   group: eef,  norm: meanstd}
  - {name: right_eef_rotation, range: [39, 45], kind: eef_rot,   group: eef,  norm: meanstd, target_dim: 3}
  - {name: right_gripper,      range: [45, 46], kind: gripper,   group: hand, norm: minmax}
  - {name: right_hand_joints,  range: [46, 58], kind: hand,      group: hand, norm: meanstd}
  # ---- shared block [58, 80) ----
  - {name: base_twist,     range: [58, 61], kind: base_twist, group: base,     norm: meanstd}
  - {name: base_pose_delta, range: [61, 64], kind: base_pose,  group: base,     norm: meanstd}
  - {name: torso_joints,   range: [64, 68], kind: joint,      group: torso,    norm: meanstd}
  - {name: lift_height,    range: [68, 69], kind: joint,       group: torso,    norm: meanstd}
  - {name: head_pan_tilt,  range: [69, 71], kind: joint,       group: head,     norm: meanstd}
  - {name: discrete_flags, range: [71, 73], kind: discrete,    group: discrete, norm: identity}
  - {name: reserved,       range: [73, 80], kind: reserved,    group: reserved, norm: identity}

# Two action heads over disjoint, contiguous slices of the same 80-dim vector.
# `manip` covers everything an arm/gripper/hand does; `aux` covers whole-body
# degrees of freedom. A sample whose aux slice is entirely invalid has its aux
# stream removed from the joint attention, not merely masked in the loss.
heads:
  manip:
    range: [0, 58]
    groups: [arm, eef, hand]
  aux:
    range: [58, 80]
    groups: [base, torso, head, discrete, reserved]

# Which segment groups are mutually exclusive control conventions. Exactly one
# member of each exclusive set is supervised per sample; the rest are masked.
# The chosen member is announced in the prompt (`action: joint` / `action: eef`).
action_types:
  joint:
    keep_groups: [arm]
    drop_groups: [eef]
  eef:
    keep_groups: [eef]
    drop_groups: [arm]

# Reference frame for eef_pos / eef_rot deltas, announced as `frame: ...`.
#   base      -> position delta in the robot base frame, rotation still local
#   eef_local -> position delta also rotated into the current eef frame
reference_frames: [base, eef_local]
