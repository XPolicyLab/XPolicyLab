[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wam-robodojo-runtime"
version = "0.1.0"
description = "Evaluation-only runtime for InternW0_delta"
requires-python = ">=3.10"
dependencies = [
  "accelerate==1.14.0",
  "einops==0.8.1",
  "hydra-core==1.3.2",
  "numpy==1.26.4",
  "omegaconf==2.3.0",
  "Pillow==11.3.0",
  "rich==14.2.0",
  "safetensors==0.8.0",
  "tqdm==4.66.5",
  "transformers==5.13.0",
]

[tool.setuptools.packages.find]
where = ["src"]
