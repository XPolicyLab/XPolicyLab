[project]
name = "focus-vlwa"
version = "1.0.0"
description = "Minimal post-training and inference code for Focus-VLWA"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "numpy>=1.26.4,<3",
    "pillow==12.3.0",
    "safetensors==0.8.0",
    "sentencepiece==0.2.2",
    "torch==2.7.1",
    "transformers==4.53.2",
]

[project.optional-dependencies]
train = ["numpy==2.2.6", "lerobot==0.4.4", "datasets==4.4.2", "av==15.1.0", "accelerate==1.10.1"]
train-v2 = ["numpy==1.26.4", "lerobot @ git+https://github.com/huggingface/lerobot.git@0cf864870cf29f4738d3ade893e6fd13fbd7cdb5"]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
focus-vlwa = "focus_vlwa.cli:main"

[project.urls]
Repository = "https://github.com/MachEmbodied/Focus-VLWA"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/focus_vlwa"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["src/focus_vlwa/model/transformers_patch"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
