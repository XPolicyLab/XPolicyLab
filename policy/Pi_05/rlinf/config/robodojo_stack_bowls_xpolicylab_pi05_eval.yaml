defaults:
- env/robodojo_stack_bowls@env.eval
- model/xpolicylab_pi05@rollout.model
- override hydra/job_logging: stdout
- _self_
task_name: stack_bowls
episode_steps: 800
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:RLINF_PATH}/examples/embodiment/config
cluster:
  num_nodes: 1
  component_placement:
    env, rollout: all
runner:
  task_type: embodied_eval
  logger:
    log_path: ${oc.env:RLINF_PATH}/../results
    project_name: robodojo_rlinf
    experiment_name: robodojo_${env.eval.init_params.task_name}_xpolicylab_pi05_eval
    logger_backends:
    - tensorboard
  max_epochs: 1000
  max_steps: -1
  only_eval: true
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null
env:
  group_name: EnvGroup
  enable_offload: false
  eval:
    total_num_envs: 128
    is_eval: true
    init_params:
      layout_seed: 1
rollout:
  group_name: RolloutGroup
  rollout_backend: huggingface
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: ${oc.env:POLICY_MODEL_PATH}
    num_action_chunks: 50
    action_dim: 14
    xpolicylab:
      policy_name: Pi_05
      rl_backend: rlinf_v0_4
      required_mode: eval
      rl:
        modes:
        - eval
        - grpo
      train_config_name: ${oc.env:PI05_TRAIN_CONFIG,pi05_base_aloha_full_sim_arx-x5_seed_0}
      repo_id: ${oc.env:PI05_REPO_ID,robodojo_${env.eval.init_params.task_name}}
      env_cfg_type: arx_x5
      action_type: joint
      rl_head:
        num_steps: 5
      task_name: ${env.eval.init_params.task_name}
