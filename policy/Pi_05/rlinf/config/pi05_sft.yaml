defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/openpi_fsdp@actor.fsdp_config
  - _self_
hydra:
  searchpath:
    - file://${oc.env:RLINF_PATH}/examples/sft/config
cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0
runner:
  task_type: sft
  logger:
    log_path: ???
    experiment_name: pytorch_sft
    project_name: xpolicylab_pi05_sft
    logger_backends: [tensorboard]
  max_epochs: -1
  max_steps: 30000
  val_check_interval: -1
  save_interval: 5000
  resume_dir: null
data:
  train_data_paths: ???  # The launcher fills in the LeRobot dataset ID from the training arguments.
  num_workers: 4
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 32
  seed: 0
  model:
    model_path: ${oc.env:POLICY_MODEL_PATH,null}
    precision: fp32
    pi05: true
    action_dim: ???
    num_action_chunks: 50
    openpi:
      task: sft
      config_name: pi05_base_aloha_full_sim_arx-x5_seed_0
      action_horizon: 50
      discrete_state_input: true
      embed_dtype: bf16
      torch_compile: false
    openpi_data:
      # Set this to the dataset's norm_stats.json. Relative paths start at the launch directory.
      norm_stats_path: ${oc.env:PI05_NORM_STATS_PATH,data/task/norm_stats.json}
  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: null
    lr_warmup_steps: 1000
    lr_scheduler: openpi_cosine
    num_cycles: 0.5
    min_lr: 2.5e-6
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    gradient_checkpointing: true
    gradient_checkpointing_use_reentrant: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32
reward:
  use_reward_model: false
critic:
  use_critic_model: false
