# The documentation site (mkdocs.yml).
#
# build    every push and pull request: the documentation tests, then a strict build (a
#          broken link, snippet, reference or generated page fails it). The built site is
#          kept for 14 days as the artifact "docs-site": download it and serve it with
#          `python -m http.server -d site`.
# publish  GitHub Pages, versioned with mike: `dev` from main, each release tag v* a version
#          and `latest`. Ready and switched off: it runs only when the repository variable
#          DOCS_PUBLISH is "true". The published site is public. To turn it on: make the
#          repository public (or use a plan with Pages for private repositories), set the
#          variable, push to main once, then Settings > Pages > Deploy from the gh-pages branch.
name: docs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  DISABLE_MKDOCS_2_WARNING: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: environment/requirements-docs.txt
      - name: Install the documentation layer
        run: python -m pip install -r environment/requirements-docs.txt -c environment/constraints.txt
      - name: Documentation tests
        run: python -m unittest discover -s tests -p test_docs.py -v
      - name: Build
        run: mkdocs build --strict --site-dir site
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site
          retention-days: 14

  publish:
    needs: build
    if: github.event_name == 'push' && vars.DOCS_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: environment/requirements-docs.txt
      - name: Install the documentation layer
        run: python -m pip install -r environment/requirements-docs.txt -c environment/constraints.txt
      - name: Deploy with mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1 || true
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            mike deploy --push --update-aliases "${GITHUB_REF_NAME#v}" latest
            mike set-default --push latest
          else
            mike deploy --push dev
            # The site opens on `latest` once a release exists, on `dev` before.
            mike list latest > /dev/null 2>&1 || mike set-default --push dev
          fi
