[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logic-preview-core"
version = "0.1.0"
requires-python = ">=3.10"
description = "Logic Preview inference runtime for RoboDojo"
license = {file = "LICENSE"}
dependencies = [
  "torch>=2.5", "torchvision>=0.20", "numpy>=1.26,<2", "Pillow>=10",
  "hydra-core==1.3.2", "omegaconf==2.3.0", "transformers>=4.49,<5",
  "safetensors>=0.5", "einops>=0.8", "ftfy>=6.3", "regex",
  "rich>=13", "sentencepiece>=0.2", "protobuf>=4", "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]
