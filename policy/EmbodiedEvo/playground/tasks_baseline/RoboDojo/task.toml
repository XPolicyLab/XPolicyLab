# Primitive-only baseline; concrete native task selected at launch.
[task]
protocol = "workspace-session-v1"
name = "embodiedevo/robodojo-baseline"
baseline = true
description = "Solve the official task directly in Test using only native primitives and current-scene feedback."

# Test-only instruction and clean workspace; no skills, lessons or Playground.
# The orchestrator creates a fresh runtime workspace for every episode.
[workspace]
source = "Workspace"

[simulator]
backend = "robodojo"
interpreter = ".venv-robodojo"
api_surface = "RoboDojoLowLevelApi"
env_task = "stack_bowls" # Override with --env-task; does not modify this file.

[agent]
preset = "codex"
model = "gpt-6-astra"
reasoning_effort = "xhigh"
timeout_sec = 0 # Test session limits are configured below.
isolation = "docker"
image = "embodiedevo-agent:xpolicy"
network = "filtered"
cpus = 4
memory_mb = 8192

[test]
scenes = 25
budget = 100
generation_timeout_sec = 0 # Unlimited Test agent session; execution slots remain bounded.
submission_timeout_sec = 1200
feedback_fps = 25
expose_success_feedback = true
