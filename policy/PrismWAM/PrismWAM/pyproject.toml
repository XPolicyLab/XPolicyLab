[build-system]
requires = ["setuptools==80.9.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "prismwam"
version = "0.1.0"
description = "PrismWAM: decoupling state representations in world action models"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
dependencies = [
  "torch>=2.10,<2.11", "torchvision>=0.25,<0.26",
  "numpy>=2.2,<2.3", "einops>=0.8,<0.9", "safetensors>=0.5,<0.9",
  "hydra-core==1.3.2", "omegaconf==2.3.0", "PyYAML>=6,<7",
  "transformers==5.8.1", "huggingface-hub>=1.3,<2", "sentencepiece>=0.2,<0.3",
  "h5py>=3.13,<4", "Pillow>=11,<13", "opencv-python-headless==4.12.0.88",
  "tqdm>=4.66,<5", "rich>=14,<16", "ftfy>=6,<7",
]

[project.optional-dependencies]
train = ["accelerate==1.14.0", "deepspeed==0.18.7", "ninja>=1.11", "wandb>=0.28,<0.29"]
data = ["pyarrow>=24,<25"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["prismwam*"]
