# LIBERO, Stage 2: joint RGB / depth / action training on the four standard suites.
# Launch after Stage 1: bash scripts/libero/stage2_joint.sh

defaults: [../stages/stage2_joint.yaml]

global_batch_size: 256
batch_size: 8                           # per GPU
num_epochs: 100
num_workers: 8
eval_every: 0                           # LIBERO has no validation split
eval_sampling_mode: auto
output_dir: ${paths.output_root}/libero/stage2_joint
wandb:
  name: libero-stage2-joint

data:
  train:
    _target_: prismwam.datasets.libero_rgbd_dataset.LiberoRGBDDepthDataset
    root_dir: ${paths.data_root}/libero
    suites: [libero_spatial, libero_object, libero_goal, libero_10]
    expected_tasks_per_suite: 10
    expected_demos_per_task: 50
    expected_source_revision: f13aa24a3da8c43c7225569f28c562979fa0e35a
    # Agent view and wrist view side by side (224x448).
    cameras: [agentview, eye_in_hand]
    video_size: [224, 448]
    num_video_frames: 5
    frame_stride: 4
    sample_stride: 1
    depth_max_meters: 1.5
    rgb_target_mode: f4                  # RGB goal 16 steps ahead
    rgb_history_num_frames: 5
    rgb_history_frame_stride: 4
    prompt_policy_id: libero_language_instruction_v1
    text_embedding_cache_dir: ${paths.data_root}/libero/text_cache
    text_encoder_id: wan22ti2v5b
    context_len: 128
    action_horizon: 16
    # 7-D delta EE actions (absolute gripper), 8-D state, min/max normalization.
    pretrained_norm_stats: ${paths.data_root}/libero/action_stats.json
    processor:
      _target_: prismwam.datasets.lerobot.processors.prismwam_processor.PrismWAMProcessor
      shape_meta:
        images:
          - key: agentview_depth
            raw_shape: [1, 128, 128]
            shape: [1, 224, 224]
          - key: eye_in_hand_depth
            raw_shape: [1, 128, 128]
            shape: [1, 224, 224]
        action:
          - key: default
            raw_shape: 7
            shape: 7
        state:
          - key: default
            raw_shape: 8
            shape: 8
      num_obs_steps: 17
      num_output_cameras: 2
      action_output_dim: 7
      proprio_output_dim: 8
      delta_action_dim_mask:
        default: [true, true, true, true, true, true, false]
      action_state_merger:
        _target_: prismwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    dataset_uid: libero_rgbd_full_f13aa24_libero4_depth_v1
  val: null

model:
  rgb_input_size: [224, 448]
  rgb_target_mode: f4
  proprio_dim: 8
  action_dit_config:
    action_dim: 7
  depth_dit_checkpoint_path: ${paths.output_root}/libero/stage1_depth/checkpoints/weights/step_015000.pt

deployment:
  benchmark: libero
  action_horizon: 16
  replan_steps: 16
