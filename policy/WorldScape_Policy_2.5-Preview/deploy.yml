# Self-contained RoboDojo T5 + VLM inference. See README for the color contract.
# Runtime architecture, normalization and sampling are restored from the checkpoint.
# Native observations stay RGB; only this trained VLM consumes a private BGR copy.
# All condition tokens use raw instructions and the total context length is 512.
