policy_name: HarnessTree
protocol: ws
host: localhost
port: null
bench_name: null
task_name: null
ckpt_name: null
env_cfg_type: null
seed: null
action_type: joint
gpu_id: null
eval_batch: false

# ARX-X5, with RGB, camera calibration when available, and own robot state. No depth.
robot: robodojo_xpl_rgb
primitives: no-vla
sam3_url: null

# One instruction-selected program drives one environment. The client polls get_action
# while that program is not ready to send a motion bound to the latest observation.
poll_s: 20.0
# The verdict is acknowledged when the episode's record is written, at most this long (keep it
# far below the client's 120 s request timeout): the client exits after its last trial, and
# the policy server is stopped with it.
wrap_up_s: 30.0
result_dir: ./results
