# Unified official evaluation configuration for pi05 and code-policy.
# Select a backend and override mode/action horizon through CLI arguments.
# Without a fixed backend, GPT selects one; only the chosen policy is loaded.
runtime:
  mode: closed_loop
  exec_horizon: 5
  replan_interval_steps: 20 # Legacy name: completed action chunks in blocking mode.
  supervisor_schedule: blocking # Pause for GPT after N chunks (20 * 5 = 100 actions).
  supervisor_retry_backoff_s: 1.0
  max_observation_age_steps: 50
  max_unreviewed_steps: 150
  supervisor_timeout_s: 120.0
  max_consecutive_failures: 3
  max_supervisor_calls: 100
  feedback_history_size: 8
  supervisor_workers: 1
  record_frames: true # Use --no-record-frames to retain text logs only.

policies:
  pi05:
    name: pi05
    description: >-
      Language-conditioned bimanual manipulation for the RoboDojo ARX X5
      simulator using current RGB images and 14 joint/gripper state values.
      Uses the simulation-trained step-59999 checkpoint and produces absolute
      joint/gripper targets. Task success is not guaranteed.
    checkpoint: ../checkpoint/RoboDojo-sim-arx_x5-joint-0/59999
    train_config_name: pi05_base_aloha_full_sim_arx-x5_seed_0
    normalization_id: arx_x5_sim
    tokenizer_path: ../checkpoint/.openpi/big_vision/paligemma_tokenizer.model
    # ARX X5 joint layout. Other candidates use the same defaults unless overridden.
    state_fields: [left_arm_joint_state, left_ee_joint_state, right_arm_joint_state, right_ee_joint_state]
    state_dims: [6, 1, 6, 1]
    action_fields: null
    action_dims: null
    camera_map:
      cam_high: cam_high
      cam_left_wrist: cam_left_wrist
      cam_right_wrist: cam_right_wrist
  code-policy:
    name: code-policy
    description: >-
      Code-policy backend with task-specific sub-skills. GPT selects an
      internal sub-skill using the current scene and chooses whether to use
      shared visual/geometry tools or the existing generated controller,
      guided by the sub-skill's frozen experience and successful source.
    # Whole-task programs are excluded from once/closed_loop selection. Set true
    # only for programs that actually declare SUPPORTS_SUBGOALS = True.
    supports_subgoals: false
    code_selection_prompt: ../prompts/robodojo_code_selection.md
    code_skills:
      arrange_largest_number_random:
        description: >-
          Arrange four or five observed physical digits descending on their
          assigned left-to-right pads amid clutter, upright/readable, then home.
          Uses current RGB, public robot geometry, per-digit feedback, bounded
          held-state API recovery and whole-task arm/order cost estimates.
          Supports arrange_largest_number_random only. User-accepted c003 sample:
          mean native score 25.625/100, zero complete successes in eight layouts.
          Same-layout development evidence; standard qualification remains false.
          Evaluated with strict gpt-6-astra and 120-second request timeout.
        code_path: ../orimapi/skills/code_skills/arrange_largest_number_random/controller.py
        code_bundle: ../orimapi/skills/code_skills/arrange_largest_number_random/skill.json
        code_parameters:
          vision_resources_path: ../orimapi/skills/code_skills/arrange_largest_number_random/vision_resources.json
          vision_model_root: ../checkpoint
          vision_device: cuda:0
          native_ik:
            device: cuda:0
      classify_objects_by_language:
        description: >-
          ALWAYS select this skill when the task instruction explicitly specifies
          which object categories go into the left, middle, and right baskets
          (e.g. 'Put X objects into the left basket, Y objects into the middle
          basket, and Z objects into the right basket, then reset the robot arm.').
          Language-directed centre sorting with route-based empty-arm clearance,
          repeated checks on each next object, and single-arm recovery.
        code_path: ../orimapi/skills/code_skills/classify_objects_by_language/runtime/c006/controller.py
        code_bundle: ../orimapi/skills/code_skills/classify_objects_by_language/runtime/c006/skill.json
        code_parameters:
          geometry:
            robot_collision_config: ../third_party/RoboDojo/Assets/Robots/x5/curobo.yml
            robot_urdf: ../third_party/RoboDojo/Assets/Robots/x5/X5A.urdf
            robot_config: ../third_party/RoboDojo/Assets/Robots/x5/robot_config.yml
            arm_config: ../third_party/RoboDojo/env_cfg/robot/dual_x5.yml
            camera_config: ../third_party/RoboDojo/env_cfg/camera/camera_config.yml
            camera_template: ../third_party/RoboDojo/env_cfg/camera/template.py
            table_config: ../third_party/RoboDojo/env_cfg/scene/default.yml
          native_ik:
            device: cuda:0
          max_moving_commands: 500
      deposit_coin:
        description: >-
          Measured held-coin workflow for deposit_coin only. Use current RGB
          and public robot geometry to preview a guarded route, acquire the coin,
          remeasure its grasp-relative pose, align with the slot and conditionally
          insert/release before homing. User-requested improvement, not standard
