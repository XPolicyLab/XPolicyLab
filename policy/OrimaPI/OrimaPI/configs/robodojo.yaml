          Supports stack_bowls only.
        code_path: ../orimapi/skills/code_skills/stack_bowls/controller.py
        code_bundle: ../orimapi/skills/code_skills/stack_bowls/skill.json
        code_parameters:
          native_ik:
            device: cuda:0
      make_kong:
        description: >-
          Observe an opponent's Mahjong discard, topple exactly three matching
          tiles, draw the stock top and stand the replacement at the row end.
          GPT binds current visual identities and stock corners; checked fixed
          stages perform side-contact toppling, supported handoff and a
          continuous wrist turn. Qualified on two distinct native seed sets;
          small-sample admission, not full benchmark reliability.
        code_path: ../orimapi/skills/code_skills/make_kong/controller.py
        code_bundle: ../orimapi/skills/code_skills/make_kong/skill.json
      put_bottles_into_dustbin:
        description: >-
          Collect four upright or lying bottles into the dustbin and home both
          arms. GPT adapts short Python segments using frozen manipulation
          functions and lessons, current RGB, public geometry and optional
          local detection/segmentation. Qualified on two of three native
          seed-set episodes; not full benchmark reliability.
        code_path: ../orimapi/skills/code_skills/put_bottles_into_dustbin/program_controller.py
        code_bundle: ../orimapi/skills/code_skills/put_bottles_into_dustbin/skill.json
        code_parameters:
          vision_resources_path: ../orimapi/skills/code_skills/put_bottles_into_dustbin/vision_resources.json
          vision_model_root: ../checkpoint
          vision_device: cuda:0
      swap_T:
        description: >-
          Swap the two T-shaped blocks into each other's initial positions and
          directed orientations, then home both arms. Uses current RGB, a
          visually selected buffer, public robot clearance and checked tool
          compositions. Qualified on all three native seed-set episodes;
          this is a small-sample result, not full benchmark validation.
        code_path: ../orimapi/skills/code_skills/swap_T/controller.py
        code_bundle: ../orimapi/skills/code_skills/swap_T/skill.json
      press_by_number:
        description: >-
          Read both current number cards and execute a counted A*na, blue,
          B*nb, blue, both-arms-home sequence using measured RGB surfaces,
          public fingertip geometry and guarded contact/release. Reuses
          preparation poses only after robot-route preflight, with recorded
          phase images and no replay after possible actuation. Native seeds0/1,
          one episode each, succeeded with score100; seed2 is untested.
          User-authorized two-seed publication, not full benchmark qualification.
        code_path: ../orimapi/skills/code_skills/press_by_number/controller.py
        code_bundle: ../orimapi/skills/code_skills/press_by_number/skill.json
        code_parameters:
          native_ik:
            device: cuda:0
      align_blocks:
        description: >-
          Align three magenta blocks with a visible white straightedge using
          both ARX X5 arms for table-supported ruler pushing. Uses current RGB
          feedback, measured motion, changed-contact recovery and return home
          within the native 200-action budget. User-accepted eight-layout sample:
          eight successes, mean native score 100/100; full benchmark unqualified.
        code_path: ../orimapi/skills/code_skills/align_blocks/controller.py
        code_bundle: ../orimapi/skills/code_skills/align_blocks/skill.json
      arrange_largest_number:
        description: >-
          Identify four or five visible numeral pieces and arrange them in
          descending order on the pads from left to right, upright/readable.
          Supports arrange_largest_number only. Uses calibrated current RGB,
          public robot state, fixed descending pad assignments and per-digit
          feedback, with nearer transfers first and checked cross-arm staging.
          Original native 1050-action budget. User-accepted eight-layout sample:
          mean native score 42.5/100, two successes; full benchmark unqualified.
        code_path: ../orimapi/skills/code_skills/arrange_largest_number/controller.py
        code_bundle: ../orimapi/skills/code_skills/arrange_largest_number/skill.json
        code_parameters:
          native_ik:
            device: cuda:0
      cover_blocks:
        description: >-
          Cover the red, green and blue blocks from left to right using the
          three inverted cups, then uncover red, green and blue in that order.
          Uses calibrated RGB and public robot state; whole-task controller
          validated on native RoboDojo episodes. Not a general sorting skill.
        code_path: ../orimapi/skills/code_skills/cover_blocks/controller.py
        code_bundle: ../orimapi/skills/code_skills/cover_blocks/skill.json
      build_tower:
        description: >-
          Build the complete eight-piece wooden tower with paired pillars,
          lower and upper boards, aligned cap and upright green roof, then home
          both arms. Uses calibrated current RGB, public robot state and a
          bounded roof-silhouette fit, with an empty-arm visibility prelude.
          Qualified on two of three small-sample native seed-set tests;
          placement remains scene-dependent and success is not guaranteed.
        code_path: ../orimapi/skills/code_skills/build_tower/controller.py
        code_bundle: ../orimapi/skills/code_skills/build_tower/skill.json
      classify_objects:
        description: >-
          ONLY select this skill when the task instruction is the generic
          'Sort the objects by category into the three baskets.' without
          assigning specific categories to the left, middle, or right baskets.
          NEVER select this skill when the instruction names specific categories
          for the left, middle, and right baskets (use classify_objects_by_language
          instead). Sort visible objects by category into three baskets using
          current RGB and public robot state, placing near basket centres and
          returning both arms home.
        code_path: ../orimapi/skills/code_skills/classify_objects/controller.py
        code_bundle: ../orimapi/skills/code_skills/classify_objects/skill.json
      play_tic_tac_toe:
        description: >-
          Fill all nine board cells with five player rings and four autonomous
          opponent crosses, not necessarily win a line. Uses current calibrated
          RGB and public robot state, placing one ring per turn, homing both
          arms and observing again after the opponent moves. Reuses a bounded
          turn program on newly observed geometry. Qualified on two of three
          native opponent seeds on one fixed board; observation timing remains
          scene-dependent and this is not full benchmark validation.
        code_path: ../orimapi/skills/code_skills/play_tic_tac_toe/controller.py
        code_bundle: ../orimapi/skills/code_skills/play_tic_tac_toe/skill.json
    code_parameters:
      # Advertised to GPT automatically; loaded only if it calls estimate_depth.
      # Missing optional weights disable only depth, not the other code skills.
      depth_estimation:
        model_path: ../checkpoint/depth-anything-v2-metric-indoor-small
        device: cpu
      geometry:
        robot_collision_config: ../third_party/RoboDojo/Assets/Robots/x5/curobo.yml
        robot_urdf: ../third_party/RoboDojo/Assets/Robots/x5/X5A.urdf
        robot_config: ../third_party/RoboDojo/Assets/Robots/x5/robot_config.yml
        arm_config: ../third_party/RoboDojo/env_cfg/robot/dual_x5.yml
        camera_config: ../third_party/RoboDojo/env_cfg/camera/camera_config.yml
        camera_template: ../third_party/RoboDojo/env_cfg/camera/template.py
        table_config: ../third_party/RoboDojo/env_cfg/scene/default.yml

# Optional fixed-policy ablation. Null enables GPT selection in every mode.
fixed_policy: null

supervisor:
  wire_api: responses
  require_model_match: true # Reject missing/mismatched response model metadata.
  reasoning_effort: null     # Omit the API field; use the provider's default.
  stream: false             # Optional SSE, Responses only.
  headers: {}               # Non-secret integration metadata only.
  auth:
    type: copilot           # Exchange the separate GitHub token; refresh in memory.
    token_file: ./copilot.credentials.json # Private JSON with a github_token field.
  # ORIMAPI_LLM_ENDPOINT and ORIMAPI_LLM_MODEL override these fields.
  endpoint: https://api.githubcopilot.com/responses
  model: gpt-6-astra
  api_key_env: OPENAI_API_KEY
  prompt_path: ../prompts/robodojo_supervisor.md
  initial_prompt_path: ../prompts/robodojo_initial.md
  review_prompt_path: ../prompts/robodojo_review.md
  selection_prompt_path: ../prompts/robodojo_policy_selection.md

evaluation:
  task: stack_bowls
  episodes: 1               # Repeat this task sequentially in one environment.
  output_root: ../runs

# Run `python -m orimapi eval` in the policy environment. RoboDojo runs in its
# separate Python interpreter. Paths are relative to this YAML file.
xpolicylab:
  root: ../third_party/RoboDojo/XPolicyLab
  simulator_root: ../third_party/RoboDojo
  simulator_python: ../.venv-robodojo/bin/python
  env_cfg_type: arx_x5
  action_type: joint
  seed: 0
  host: 127.0.0.1
  port: 0                    # Let the policy server select a free port.
  request_timeout_s: 1800.0  # Covers selection, model loading and inference.
  evaluation_timeout_s: 3600.0
  shutdown_timeout_s: 10.0
  headless: true
  simulator_gpu: 0
  camera_map: null           # Default ARX camera aliases; override if needed.
