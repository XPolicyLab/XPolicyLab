policy_name: Spark_0       # must equal the adapter directory name
protocol: ws
bench_name: null
task_name: null
env_cfg_type: null
action_type: ee            # recipes train EE poses; eval.sh can still override
gpu_id: null
seed: null
eval_batch: true

# XPolicyLab model server
host: localhost
port: 6000

# Spark_0 runtime
starvla_root: source_starvla
checkpoint_path: null      # injected by the launcher: SPARK_0_CKPT_PATH, else
                           # the final / highest-step checkpoint of the ckpt_name run
Spark_0_server_host: 127.0.0.1
Spark_0_server_port: 5694

# auto = replay the checkpoint's saved training config (see README Deployment)
unnorm_key: auto
image_size: auto
max_infer_batch: auto
include_state: auto
state_history_frames: auto
ee_in_camera_frame: auto
ee_camera_pose: auto
ee_camera_extrinsics_semantics: auto
ee_camera_axes: auto
flexible_views: auto
required_views: auto
tactile: auto              # false = disable the glove (A/B the same checkpoint)
tactile_fast: auto         # false = drop the region (fast) stream
tactile_slow: auto         # false = drop the 3D (slow) stream

# execute_horizon and rtc are NOT set here: they are deploy-time knobs on the
# live model config, which the launcher locates via SPARK_0_MODEL_CONFIG,
# model_configs/<ckpt_name>.yaml, or the stem the checkpoint recorded.
