# Spark-0 SFT recipe (visual + tactile), warm-started from pretrain_spark_0.
#
# Same architecture as pretrain_spark_0. Differences:
#   - warm start from the pretrain checkpoint, reusing its normalization
#     stats (trainer.pretrained_checkpoint must be set before launch)
#   - 80k steps, 8k warmup (shortcut-mask ramp follows), save every 10k
#   - rtc: default for deployment
#   - DA3 teacher at 392 px (pretrain: 336), sample_without_replacement off

run_root_dir: ../checkpoints
seed: 0

# Robot layout only (keys / dims / camera catalog): model_configs/embodiments/.
embodiment: tianji_marvin_wuji

# ── Deploy-only (read from the live config at eval time) ─────────────────────
execute_horizon: null      # sync path only; ignored while RTC is on
rtc: default               # model_configs/rtc/default.yaml; null = sync

# ── Tactile switches ─────────────────────────────────────────────────────────
# Must match the pretrain checkpoint. train.sh writes the `enable` flags, so
# do not set them inline.
tactile_fusion: default    # tactile encoder + Action-DiT fusion
tactile_align: default     # train-only contact-region -> visual-token alignment

# ── Data ─────────────────────────────────────────────────────────────────────
# null = train.sh uses the positional dataset path (needs meta/modality.json).
# List form: `- dataset: <name>` + `weight: <prob>`.
data_mixture: null

wandb_entity: null
wandb_project: Spark_0-xpolicy
is_debug: false
version_id: '0.21'         # config schema version; do not change

# Everything under `framework` must match the pretrain checkpoint's graph;
# see pretrain_spark_0.yaml for the per-key notes.
framework:
  name: QwenPI_v3
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2

  action_query:
    enable: true
    num_query: 64
    kv_mode: query_plus_visual     # DiT reads queries + full VL sequence
    init_std: 0.02

  action_model:
    action_model_type: LayerwiseFM # layerwise flow-matching DiT
    action_dim: 58
    state_dim: 58
    continuous_state: true
    action_horizon: 50
    repeated_diffusion_steps: 6    # noise samples per obs; multiplies DiT batch
    num_inference_timesteps: 4     # Euler steps at inference
    add_pos_embed: true
    max_seq_len: 1024
    num_target_vision_tokens: 0    # 0 = no GR00T future slots
    shortcut_mask_prob: 0.1        # zero VL cross-attn on 10% of tactile rows
    shortcut_mask_warmup_steps: 8000   # ramp 0 -> prob; = num_warmup_steps
    noise_beta_alpha: 1.5          # timestep ~ Beta(alpha, beta) * noise_s
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    action_loss_weight:            # these values = plain mean (all off)
      horizon_power: 0.0
      exec_rows: 0
      exec_weight: 1.0
      keys: {}
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      dropout: 0.1
      final_dropout: true
      interleave_self_attention: true  # odd DiT blocks are self-attn only
      norm_type: ada_norm
      positional_embeddings: null
      attention_head_dim: 64
      use_canonical_forward: true
      attention_bias: true
      activation_fn: gelu-approximate
      num_embeds_ada_norm: 1000
      upcast_attention: false
      norm_elementwise_affine: false
      norm_eps: 1.0e-05
      max_num_positional_embeddings: 512

  spatial_alignment:
    enable: true
    teacher_model_path: ./playground/Pretrained_models/DA3-LARGE
    teacher_feature_dim: 1024      # ViT-L embed dim
    teacher_feat_layer: 23         # last ViT-L block
    teacher_image_size: 392        # multiple of 14 (pretrain_spark_0 uses 336)
    teacher_preserve_aspect: true  # no-op while obs_image_size is square
    teacher_view_mode: independent # one teacher pass per camera
    teacher_ref_view_strategy: first   # `joint` view mode only
    teacher_chunk_size: 0          # >0 caps samples per teacher forward (VRAM)
    teacher_dtype: bfloat16
    align_view_indices: null       # null = every present packed view
    align_layer_index: 25          # must be odd (see interleave_self_attention)
    loss_coeff: 0.2
    use_vlm_norm: true
    target_spatial_zscore: false
    add_target_pos_embed: true     # 2D sin-cos PE on teacher targets
    target_pos_embed_scale: 0.1
    projector_hidden_dim: null     # null = 2 x teacher_feature_dim

  token_prune:
    enable: false                  # BFA++ visual-token pruning

# Pose formats / normalization / cameras must match the pretrain run, since
# use_pretrained_stats normalizes with the checkpoint's statistics.
datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_mix: xpolicylab_runtime   # built by train.sh from data_mixture
    data_root_dir: ../data
    lerobot_version: v3.0
    video_backend: pyav            # decoder; avoid decord / opencv on AV1 exports

    # Loader
    per_device_batch_size: 6
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2

    # Sampling
    balance_dataset_weights: false # false = data_mixture weights are probs
    balance_trajectory_weights: false
    sample_without_replacement: false  # true is single-dataset only

    # Cameras (named keys in obs_image_size = active cameras)
    obs_image_size:
      cam_high: [384, 384]
      cam_left_wrist: [256, 256]
      cam_right_wrist: [256, 256]
    flexible_views: true           # samples may miss trailing cameras (masked)
    required_views: null
    observation_indices: [0]       # current frame only

    # State / action representation
    include_state: true
    state_history_frames: 3
    sample_dtype: float32
    ee_in_camera_frame: true       # required by cam_* pose formats
    camera_extrinsics_key: null    # null = from meta/modality.json
    camera_extrinsics_semantics: null
    state_pose_format: cam_abs_xyz_rot6d
    action_pose_format: delta_xyz_rot6d
    state_normalization: q99
    action_normalization: q99
    pose_normalization: hold_centered_perrow  # identity delta -> 0 (anti-windup)
    action_mode: abs               # only valid value with delta pose formats
    action_mode_apply_keys: null
    action_mode_state_map: {}
    ref_noise:                     # parked: train.sh rejects prob > 0
      prob: 0.0
      rot_deg: 10.0
      trans_m: 0.02

    exclude_episodes: []
    delete_pause_frame: false

trainer:
  # Warm start: fresh optimizer and step counter; keep resume_from null.
  resume_from: null
  is_resume: false
  pretrained_checkpoint: null      # REQUIRED: pretrain .pt (e.g. steps_400000_pytorch_model.pt);
                                   # or pass trainer.pretrained_checkpoint=<path> on the CLI
  use_pretrained_stats: true       # normalize with the checkpoint's stats
                                   # instead of recomputing on the SFT data
  reload_modules: null

  max_train_steps: 80000
  num_warmup_steps: 8000
  save_interval: 10000
  eval_interval: 10000             # fixed-batch train MSE, not held-out
  save_format: pt

  # Per-module LR; groups for disabled modules are ignored.
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 0.0001
    project_layers: 0.0001
    spatial_align: 0.0001
    token_prune: 0.001
    tactile_encoder: 0.0001
    tactile_fusion: 0.0001
    tactile_align: 0.0001
    tactile_future_contact: 0.0001
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''               # comma-separated module patterns
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  repeated_diffusion_steps: null   # null = use framework.action_model value
  optimizer:
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
