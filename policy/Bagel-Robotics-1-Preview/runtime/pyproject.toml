[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bagel-robotics-1-preview-runtime"
version = "0.1.0"
description = "Inference runtime for the Bagel-Robotics-1-Preview RoboDojo adapter"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "torch>=2.5", "torchvision>=0.20", "accelerate>=1.0",
  "hydra-core==1.3.2", "omegaconf==2.3.0", "transformers>=4.49,<5",
  "safetensors>=0.5", "numpy>=1.26,<2", "einops>=0.8",
  "Pillow>=10", "rich>=13", "tqdm>=4.66", "ftfy>=6.3",
  "huggingface-hub>=0.27"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vpp2*"]
