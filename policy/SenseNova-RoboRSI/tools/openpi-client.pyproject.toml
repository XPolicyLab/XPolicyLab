[build-system]
requires = ["setuptools==65.5.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"
[project]
name = "openpi-client"
version = "0.1.0"
requires-python = ">=3.7"
dependencies = ["dm-tree>=0.1.8", "msgpack>=1.0.5", "numpy>=1.22.4,<2.0.0", "pillow>=9.0.0", "websockets>=11.0"]
[tool.setuptools.packages.find]
where = ["src"]
include = ["openpi_client*"]
