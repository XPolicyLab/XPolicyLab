[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "cr-wm-posttrain"
version = "0.1.0"
description = "Standalone RGB-D RobotWin Clean post-training for CR-WM"
requires-python = ">=3.12"
dependencies = ["numpy==1.26.4", "safetensors==0.5.3", "einops==0.8.1", "av==16.0.1", "pyarrow==23.0.0", "pillow==12.0.0", "rich==14.2.0", "tqdm==4.67.1"]
[tool.setuptools.packages.find]
where = ["src"]
include = ["crwm*"]
