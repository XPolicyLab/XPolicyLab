output_dir: runs/libero/video
overwrite: true
batch_size: 8
num_workers: 8
lr_scheduler_type: cosine
learning_rate: 5.0e-06
warmup_steps: 200
num_epochs: 1
max_steps: 10000
log_every: 10
save_every: 2000
eval_every: 1000
eval_num_inference_steps: 10
train_mode: video_only
train_wan: true
optimizer_betas:
- 0.9
- 0.999
checkpoint_mode: full
frozen_video_checkpoint: null
gradient_accumulation_steps: 1
mixed_precision: bf16
seed: 42
max_grad_norm: 1.0
weight_decay: 0.01
resume: null
resume_ckpt: null
preflight:
