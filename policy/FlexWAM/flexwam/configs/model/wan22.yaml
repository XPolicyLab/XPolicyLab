# WAN keeps native UMT5 cross-attention on both video and action experts.
_target_: flexwam.models.architectures.builder.create_flexwam
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: ${data.text.context_len}
load_text_encoder: false
context_input_dim: 4096
proprio_dim: ${data.robot.state_dim}
redirect_common_files: true
mot_checkpoint_mixed_attn: false
action_dit_pretrained_path: ${oc.env:FLEXWAM_ACTION_DIT_PATH,./checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt}
skip_dit_load_from_pretrain: false
state_conditioning:
  mode: separate  # separate per-expert state, or one shared leading state token
  drop_prob: 0.0
action_attention:
  mode: logit_bias  # additive: per-camera softmax, then scale and add; logit_bias: one softmax with log(scale) bias
  bias_strength: 1.0
use_cuda_graph: false
video:
  state_conditioning:
    enabled: false
    mode: prefix
    num_tokens: 1
  has_image_input: false
  patch_size:
  - 1
  - 2
  - 2
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  video_attention_mask_mode: first_frame_causal
  action_conditioned: false
  action_dim: ${data.robot.action_dim}
  action_group_causal_mask_mode: group_diagonal
  num_views: ${len:${data.observation.cameras}}
  use_camera_embedding: true
  # Every Nth block (zero-based N-1, 2N-1, ...) lets each view attend to all views;
  # other blocks stay view-local. A list in cross_view_attention_layers overrides it.
  cross_view_attention_interval: 2
  cross_view_attention_layers: null
action_dit:
  action_dim: ${data.robot.action_dim}
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000
action_scheduler:
  train_shift: 1.0
  infer_shift: 1.0
  num_train_timesteps: 1000
loss:
  lambda_action: 1.0
  lambda_video: 1.0
router:
  state_conditioning:
    enabled: false
    mode: late_concat
    hidden_dim: 512
  arch: spatial_query_v1
  feature_layer_index: 19  # Output of the 20th block (zero-based index).
  feature_dim: 512
  pool_grid: [4, 4]
  num_queries: 4
  num_heads: 8
  spatial_hidden_dim: 2048
  branch_output_dim: 1024
  head_hidden_dim: 1024
critic:
  state_conditioning:
    enabled: false
    mode: late_concat
    hidden_dim: 512
  arch: spatial_query_v1
  feature_layer_index: 19  # Output of the 20th block (zero-based index).
  feature_dim: 512
  pool_grid: [4, 4]
  num_queries: 4
  num_heads: 8
  spatial_hidden_dim: 2048
  branch_output_dim: 1024
  head_hidden_dim: 1024
