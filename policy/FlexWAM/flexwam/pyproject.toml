[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flexwam"
version = "0.1.0"
description = "FlexWAM: video-action modeling with shared routing and critic heads"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "accelerate==1.12.0",
  "av==16.0.1",
  "boto3==1.35.99",
  "datasets==3.6.0",
  "deepspeed==0.18.5",
  "diffusers==0.33.1",
  "einops==0.8.1",
  "gitpython==3.1.45",
  "huggingface-hub>=0.34.0,<1.0",
  "hydra-core==1.3.2",
  "imageio==2.37.0",
  "imageio-ffmpeg==0.6.0",
  "jsonlines==4.0.0",
  "matplotlib==3.10.9",
  "modelscope==1.34.0",
  "msgpack>=1.0.5",
  "numpy==1.26.4",
  "omegaconf==2.3.0",
  "openpi-client==0.1.2",
  "packaging==25.0",
  "pandas==2.2.3",
  "pillow==12.0.0",
  "pyarrow==23.0.0",
  "regex==2025.11.3",
  "rich==14.2.0",
  "safetensors==0.5.3",
  "termcolor==2.5.0",
  "tqdm==4.66.5",
  "transformers==4.57.1",
  "typing-extensions==4.15.0",
  "wandb==0.23.1",
  "websockets>=15,<17",
]

[project.scripts]
flexwam-deploy = "deploy.server:main"

[tool.setuptools.package-dir]
"" = "src"
deploy = "deploy"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["flexwam*", "deploy*"]
