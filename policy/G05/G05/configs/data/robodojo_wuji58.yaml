# RoboDojo LeRobot v3.0 export of the tianji_wuji robot in the WUJI 58-D hybrid layout.
#
# Produce the dataset with
#   python XPolicyLab/scripts/transform_lerobot_v30_format.py --representation wuji58 ...
# The flat `observation.state` / `action` columns are then 58 wide
# ([L hand 20 | L wrist 9 | R hand 20 | R wrist 9], names = XPolicyLab.utils.wuji58.MOTOR_NAMES)
# and meta/info.json carries `repr_mode: wrist_rel_te2`; train.sh refuses anything else.
_target_: g05.data.mixture_lerobot_dataset.MixtureLerobotDataset
use_weight_normalization: true
use_weight_for_sampling: false
action_size: 32
past_action_size: 0
obs_size: 1
val_set_proportion: 0.01
is_training_set: true
in_memory: true

embodiment_datasets:
  robodojo_wuji58:
    type: g05.data.base_lerobot_datasetV3.BaseLerobotDatasetV3
    embodiment_type: robodojo_wuji58
    lerobot_ds_version: "3.0"
    shape_meta: &robodojo_wuji58_shape_meta
      action:
        - key: left_hand
          lerobot_key: action
          start_index: 0
          raw_shape: 20
          shape: 20
          time_offset: 0
        - key: left_wrist
          lerobot_key: action
          start_index: 20
          raw_shape: 9
          shape: 9
          time_offset: 0
        - key: right_hand
          lerobot_key: action
          start_index: 29
          raw_shape: 20
          shape: 20
          time_offset: 0
        - key: right_wrist
          lerobot_key: action
          start_index: 49
          raw_shape: 9
          shape: 9
          time_offset: 0
      state:
        - key: left_hand
          lerobot_key: observation.state
          start_index: 0
          raw_shape: 20
          shape: 20
          time_offset: 0
        - key: left_wrist
          lerobot_key: observation.state
          start_index: 20
          raw_shape: 9
          shape: 9
          time_offset: 0
        - key: right_hand
          lerobot_key: observation.state
          start_index: 29
          raw_shape: 20
          shape: 20
          time_offset: 0
        - key: right_wrist
          lerobot_key: observation.state
          start_index: 49
          raw_shape: 9
          shape: 9
          time_offset: 0
      images:
        - key: cam_high
          camera_type: exterior
          lerobot_key: observation.images.cam_high
          start_index: 0
          raw_shape: [3, 480, 640]
          shape: [3, 256, 256]
          time_offset: 0
        - key: cam_left_wrist
          camera_type: wrist_left
          lerobot_key: observation.images.cam_left_wrist
          start_index: 0
          raw_shape: [3, 480, 640]
          shape: [3, 256, 256]
          time_offset: 0
        - key: cam_right_wrist
          camera_type: wrist_right
          lerobot_key: observation.images.cam_right_wrist
          start_index: 0
          raw_shape: [3, 480, 640]
          shape: [3, 256, 256]
          time_offset: 0
    dataset_groups:
      - weight: 1.0
        dataset_dirs:
          - ${oc.env:ROBODOJO_LEROBOT_V30_ROOT}

processors:
  robodojo_wuji58:
    shape_meta: *robodojo_wuji58_shape_meta
    action_state_transforms: null
    train_transforms:
      cam_high: ${oc.load:configs/data/_transforms.yaml,train_head}
      cam_left_wrist: ${oc.load:configs/data/_transforms.yaml,train_head}
      cam_right_wrist: ${oc.load:configs/data/_transforms.yaml,train_head}
    val_transforms:
      cam_high: ${oc.load:configs/data/_transforms.yaml,val_exterior}
      cam_left_wrist: ${oc.load:configs/data/_transforms.yaml,val_exterior}
      cam_right_wrist: ${oc.load:configs/data/_transforms.yaml,val_exterior}
    norm_default_mode: z-score
    norm_exception_mode: null
    action_filter:
      _target_: g05.data_processor.transforms.action_filter.DummyActionFilter
    action_state_merger:
      _target_: g05.data_processor.transforms.action_state_merger.PaddingActionMerger
      merge: true
      max_action_shape_meta: 58
      max_state_shape_meta: 58
    num_obs_steps: 1
    use_stepwise_action_norm: false
    drop_high_level_prob: 1.0
    use_zh_instruction: false
