policy_name: G05
protocol: ws
host: localhost
port: null
bench_name: null
task_name: null
ckpt_name: null
env_cfg_type: arx_x5
seed: null
action_type: joint
# Unused by model.py; dims come from get_robot_action_dim_info(env_cfg_type)
# (14 for arx_x5 joint, 58 for the tianji_wuji ee hybrid).
action_dim: 14
eval_batch: true
ws_ping_timeout_s: 120.0
ws_ping_interval_s: 120.0

g05_root: null
ckpt_path: null
# null = auto: robodojo for joint checkpoints, robodojo_wuji58 for the tianji_wuji hybrid.
eval_embodiment: null
# Frame of the 58-D wrist blocks (tianji_wuji only): te2 (WUJI SimBench head camera) or world.
wrist_frame: te2
action_steps: 16
frequency: 30
# The launcher passes action_source=ar or action_source=fm.  The adapter derives
# matching Hydra flags from that value so one deploy file safely serves both.
hydra_overrides: []
