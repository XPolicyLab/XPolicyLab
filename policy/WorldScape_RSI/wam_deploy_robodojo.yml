# RoboDojo defaults follow flash; memory and legacy q99 checkpoints use their metadata.
# Select this file with WSP_DEPLOY_CONFIG on both policy and client hosts.
policy_name: WorldScape_RSI
protocol: ws
host: localhost
port: null
bench_name: null
task_name: null
ckpt_name: null
env_cfg_type: arx_x5
seed: 62
action_type: joint
eval_batch: true
runtime_profile: robodojo
worldscape_root: null
checkpoint_path: null
device: cuda
mode: interactive
multi_gpu:
  enabled: false
  max_envs_per_gpu: null
  worker_timeout_s: 1200

# Training's loader converts command RGB frames into its legacy BGR model input.
input_color_order: bgr
# CACHE_VIDEO_DECODE=false + AUGMENT_VIDEO=true: deterministic eval resize.
policy_image_interpolation: bilinear_antialias
diffusion_view_layout: mosaic_2x2
action_horizon: 24
replan_steps: 24
observation_interval: 3
observation_history_segments: 8
use_observation_history: true
use_causal_memory: true
# Rolling capacity comes from the checkpoint: flash uses 1 chunk, memory uses 24.
# Flash keeps only the current frame and rebuilds inference state each prediction.
wam_history_mode: rolling
short_window_for_non_memory_tasks: false
memory_window_chunks: null
ordinary_window_chunks: null
reset_independent_blocks: false
constrain_action_padding: true

default_instruction: follow the instruction
t5_prompt_template: null
gripper_discretization:
  # Checkpoint metadata overrides only enabled; tuning stays in this file.
  enabled: false
  close_threshold: 0.60
  open_threshold: 0.85
  min_closed_steps: 0
  open_confirmation_steps: 1

validate_checkpoint_artifacts: true
request_timeout_s: 1200
max_connect_attempts: 600
connect_retry_delay_s: 1
max_connect_seconds: 1200
ws_ping_interval_s: 20
ws_ping_timeout_s: 1200
