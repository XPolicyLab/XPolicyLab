# XPolicyLab deploy config for the RoboDojo VLM policy.
# The whole file is handed to Model(deploy_cfg); `robodojo.sh eval` overrides
# the top-level runtime keys, and the `vlm_agent` block below is ours.
policy_name: vlm_agent_rsi3_pour
protocol: ws
host: localhost
port: null
bench_name: null
task_name: null
ckpt_name: null
env_cfg_type: null
seed: null
# The planned trajectories are joint actions; run_vlm_eval.sh passes the same label.
action_type: joint
gpu_id: null
# One VLM call per turn cannot be batched across envs; keeping this false
# also makes RoboDojo force num_envs to 1.
eval_batch: false

# The values below are the ones the reported results were produced with.
# scripts/robodojo/run_vlm_experiment.py passes the same values through
# VLM_AGENT_OVERRIDES, so both entry points run the same configuration.
vlm_agent:
  # Profile name or model ID from the secrets.json "vlm" list; null takes the first.
  # Overridden by run_vlm_eval.sh --model or VLM_AGENT_PROFILE.
  vlm_profile: null
  # Cameras shown to the model every turn: the head view and both wrist views.
  cameras: [cam_head, cam_left_wrist, cam_right_wrist]
  image_max_width: 640
  jpeg_quality: 80
  # Reasoning models spend part of this budget on hidden reasoning tokens.
  max_tokens: 8000
  temperature: null
  # Forwarded to the endpoint as reasoning_effort.
  reasoning_effort: high
  request_timeout_s: 600.0
  max_attempts: 6  # initial request + five retries for transient service/network errors
  retry_delay_s: 2.0
  # Decision budget includes retries; the simulation RPC timeout tracks this value.
  decision_budget_s: 660.0  # RPC timeout is raised to this + 30 s by deploy.py
  max_decisions: 240
  max_zero_progress: 5
  max_consecutive_errors: 2
  episode_budget_s: 9000.0
  log_dir: eval_result/_vlm_logs
  log_images: true

  # Read the gripper joint instead of trusting the commanded opening. RoboDojo's
  # `<side>_ee_joint_state` is the last applied command, so it reaches 0 whether
  # or not an object stopped the fingers; the measured value is the only signal
  # that separates a grasp from an empty close. It also drives the grasp record
  # in the prompt (the height a grasp happened at, and the release height that follows).
  measure_gripper: true
  # Measured opening, above fully closed, that counts as "something is held".
  # The x5 gap spans 0.108 m over [0, 1], so 0.05 is about 5 mm of object.
  grasp_open_threshold: 0.05

  # Overlays drawn on cam_head and the wrist views:
  #   markers - wrist circle, fingertip-centre cross and the line between them
  #   grid    - 10 cm table grid at table_z with X/Y labels and an axis legend
  #   enhance - percentile contrast stretch (display only, no pixel moves)
  visual_aids:
    markers: true
    grid: true
    enhance: true

  main:
    # Profile YAML with the robot/frame/workspace/cameras/gripper/tips text the
    # system prompt is built from; null = profiles/robodojo_x5_main.yaml.
    profile: null
    max_commands_per_turn: 4
    # Machine-written history of the last N turns and the model-written scratchpad.
    history_turns: 12
    memory_history: true
    memory_scratchpad: true
    # "done" never ends the episode by itself; this many consecutive done turns do.
    done_limit: 3
    # Step cap for a planned 'home' (it travels far) and for any other planned motion;
    # the episode limits still apply.
    home_plan_steps: 10000
    max_plan_steps: 10000
    # Hold the final joint target for this many control steps before judging tracking.
    motion_settle_steps: 10
    # Fingertip centre ahead of the wrist; the point every command acts on.
    tcp_offset_m: 0.145

  # The in-context demonstration: <demo_bank>/<task>/demo.json, one entry per
  # task. Relative paths are resolved from the repository root.
  icl:
    demo_bank: demos/robodojo_official_video
    demo_count: 1

  curobo:
    # Environment steps one planned motion may consume unless the request
    # raises it (main.max_plan_steps / main.home_plan_steps do).
    max_plan_steps: 60
    # Trajectory points per environment step; null derives it from the
    # environment's control period and the planner's interpolation dt.
    stride: null

  controller:
    # Control steps spent on a gripper command and on a "wait".
    gripper_steps: 6
    hold_steps: 3
    # Height of the table top in the env-local frame.
    table_z: 0.765
    # Environment control rate (RoboDojo's arx_x5 config collects at 25 Hz).
    control_hz: 25.0
